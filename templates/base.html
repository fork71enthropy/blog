{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Computer Science & Security{% endblock %}</title>

  <meta property="og:title" content="{% block og_title %}Computer Science & Security{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Personal notes on Django, web security, and computer science.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.opus-symmetry.fr{{ request.path }}">
  <meta name="twitter:card" content="summary">

  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  {% include 'header.html'%}
  <!-- dans post_detail.html -->


  <main> 
    {% for message in messages %}
      <p><i>{{ message }}</i></p>
    {% endfor %}

    {% block content %}

    
    {% endblock %} 
  </main>
  {% include 'footer.html'%}
</body>
</html>
