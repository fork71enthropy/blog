{% extends "base.html" %}
{% load static %}
{% block extra_head %}
<link rel="stylesheet" href="{% static 'quiz/css/quiz-theme.css' %}">
{% endblock %}
{% block content %}
<script>document.body.classList.add('quiz-theme');</script>

<div class="qz-card">
    <p class="quizzes-heading">Quiz disponibles</p>
    {% if quizzes %}
        <ul class="quiz-list">
            {% for quiz in quizzes %}
                <li class="quiz-list-item"><a href="{% url 'quiz_detail' quiz.id %}">{{ quiz.post.title_post }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="empty-state">Aucun quiz disponible pour le moment.</p>
    {% endif %}
</div>
{% endblock %}
