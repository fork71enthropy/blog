
<style>

body {
    background: #0D1117 !important;
    margin: 0;
    min-height: 100vh;
}

@import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Inter:wght@400;500;600&display=swap');

.quizzes-wrapper {
    background: #0D1117;
    color: #E6EDF3;
    font-family: 'Inter', system-ui, sans-serif;
    max-width: 640px;
    margin: 40px auto;
    padding: 32px;
}

.quizzes-heading {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: #F0B429;
    margin-bottom: 24px;
}

.quiz-list {
    list-style: none;
    padding: 0;
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.quiz-list-item a {
    display: block;
    background: #161B22;
    border: 1px solid #30363D;
    border-radius: 8px;
    padding: 16px 20px;
    color: #E6EDF3;
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    line-height: 1.5;
    transition: border-color 0.15s ease, background 0.15s ease;
}

.quiz-list-item a:hover {
    border-color: #F0B429;
    background: #1F2733;
}

.quiz-list-item a:focus-visible {
    outline: 2px solid #58A6FF;
    outline-offset: 2px;
}

.quiz-list-item a::before {
    content: "▸ ";
    color: #F0B429;
    font-family: 'JetBrains Mono', monospace;
}

.empty-state {
    color: #8B949E;
    font-size: 0.95rem;
}

@media (max-width: 600px) {
    .quizzes-wrapper { margin: 0; padding: 20px; }
}
</style>

<div class="quizzes-wrapper">
    <p class="quizzes-heading">Quiz disponibles</p>

    {% if quizzes %}
        <ul class="quiz-list">
            {% for quiz in quizzes %}
                <li class="quiz-list-item">
                    <a href="{% url 'quiz_detail' quiz.id %}">{{ quiz.post }}</a>
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="empty-state">Aucun quiz disponible pour le moment.</p>
    {% endif %}
</div>
